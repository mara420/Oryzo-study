<body><main id="track" aria-label="Five scroll-driven chapters"><h1 class="sr">COASTER. A photographic and live 3D study</h1></main><div id="viewport"><div id="stage"><div id="plates"></div><div id="takeover"><canvas id="clean" aria-hidden="true"></canvas><canvas id="clean2" aria-hidden="true"></canvas><div id="contactShadow"></div><div id="live" aria-label="Live 3D coaster"></div></div><div id="front"></div><div id="curtain"></div><div id="grain"></div><div id="fallback" hidden>Photo mode · WebGL unavailable</div><button class="hit product" data-go="1" aria-label="Product"></button><button class="hit materials" data-go="3" aria-label="Materials"></button><button class="hit story" data-go="2" aria-label="Touch"></button><button class="hit contact" data-go="4" aria-label="Ritual"></button><button id="replay" aria-label="Experience again"></button></div><div id="mobileCopy"><h1></h1><p></p></div></div><div id="progress"></div><button id="mode" aria-pressed="true" disabled>LOADING 3D</button><a id="credit" href="../hybrid/">PREVIOUS VERSION ↗</a><nav id="nav" aria-label="Chapters"></nav><button id="next">NEXT ↓</button><div id="hint">SCROLL TO EXPLORE<span id="livehint">PHOTOGRAPHIC INTRO</span></div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),plates=$('#plates'),clean=$('#clean'),live=$('#live'),mode=$('#mode'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const data=[
['01-workshop.png','Coaster.','The beauty of the ordinary.'],
['02-object.png','Nothing to add.','Pure cork. Nothing else.'],
['03-touch.png','Made to be held.','A study in human scale and touch.'],
['04-material.png','Nature, up close.','The natural character of cork, revealed in detail.'],
['05-ritual.png','Make time for the little things.','Simple, thoughtful pieces for a more peaceful everyday.']];
const stops=[0,.285,.52,.735,.96],images=[],nav=[];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t;
let current=0,p=0,last=performance.now(),mx=0,my=0,photoEnabled=false,webgl=null,dragX=0,dragY=0,drag=null,plateReady=false,heroReady=false;
const source='../photo/assets/';
for(const [i,d] of data.entries()){const im=new Image();im.alt=d[1]+' — '+d[2];im.decoding='async';im.src=source+d[0];(i<2?plates:$('#front')).append(im);images.push(im);const b=document.createElement('button');b.textContent='0'+(i+1);b.setAttribute('aria-label',d[1]);b.onclick=()=>go(i);$('#nav').append(b);nav.push(b);}
function go(i){scrollTo({top:stops[clamp(i,0,4)]*Math.max(1,document.documentElement.scrollHeight-innerHeight),behavior:reduce?'auto':'smooth'});}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));$('#replay').onclick=()=>go(0);$('#next').onclick=()=>go(current===4?0:current+1);
addEventListener('keydown',e=>{if(/INPUT|BUTTON|A/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
function ready(im){return im.complete&&im.naturalWidth?Promise.resolve():new Promise((res,rej)=>{im.addEventListener('load',res,{once:true});im.addEventListener('error',rej,{once:true})})}
// Remove the isolated product from the photograph, keeping its original typography,
// ambient light and the photographic shadow underneath. Interpolate smooth dark backdrop
// from the visible sides of the silhouette rather than drawing a second product.
let objectPlate,heroPlate;
async function prepareObjectPlate(){await ready(images[1]);const im=images[1],c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const image=ctx.getImageData(0,0,c.width,c.height),w=c.width,h=c.height,d=image.data,src=new Uint8ClampedArray(d);
const cx=.597*w,cy=.481*h,rx=.205*w,ry=.373*h;
for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){
 const dy=(y-cy)/ry;if(Math.abs(dy)>=1)continue;const half=rx*Math.sqrt(1-dy*dy),lo=Math.max(0,Math.floor(cx-half)),hi=Math.min(w-1,Math.ceil(cx+half));if(hi<=lo)continue;
 const a=Math.max(0,lo-Math.round(w*.018)),b=Math.min(w-1,hi+Math.round(w*.018));
 for(let x=lo;x<=hi;x++){const r=Math.hypot((x-cx)/rx,dy),edge=1-ease(.94,1,r),t=(x-a)/Math.max(1,b-a),i=(y*w+x)*4,ia=(y*w+a)*4,ib=(y*w+b)*4;for(let k=0;k<3;k++)d[i+k]=mix(src[i+k],mix(src[ia+k],src[ib+k],t),edge);}
}
ctx.putImageData(image,0,0);objectPlate=c;plateReady=true;}
prepareObjectPlate().catch(()=>{plateReady=false});
// The original hero remains the exact still image at rest. A short live reveal
// uses a reconstructed local cutting-mat patch under the moving coaster.
async function prepareHeroPlate(){
 await ready(images[0]);const im=images[0],c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;
 const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const pixels=ctx.getImageData(0,0,c.width,c.height),w=c.width,h=c.height,d=pixels.data,src=new Uint8ClampedArray(d);
 const cx=.559*w,cy=.481*h,rx=.166*w,ry=.290*h;
 const cell=.030*w,stepY=.052*h;
 for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++)for(let x=Math.max(0,Math.floor(cx-rx));x<Math.min(w,Math.ceil(cx+rx));x++){
  const r=Math.hypot((x-cx)/rx,(y-cy)/ry);if(r>=1)continue;
  // Tile real green mat pixels from an unobstructed upper section, aligned
  // approximately with the photographed perspective. This is not a 3D scan.
  const mod=(v,n)=>((v%n)+n)%n;
  const sy=Math.floor(.112*h+mod(y+.045*x-.112*h,stepY));
  const sx=Math.floor(.465*w+mod(x-.11*(y-sy)-.465*w,cell*3));
  const j=(sy*w+sx)*4,i=(y*w+x)*4,alpha=1-ease(.93,1,r);
  for(let k=0;k<3;k++)d[i+k]=mix(src[i+k],src[j+k]*.90,alpha);
 }
 ctx.putImageData(pixels,0,0);heroPlate=c;heroReady=true;
}
prepareHeroPlate().catch(()=>{heroReady=false});
Promise.all(images.map(ready)).catch(()=>{$('#fallback').hidden=false;$('#fallback').textContent='Some images failed to load.'});
window.hybrid={version:'1.2',get liveOpacity(){return Number($('#takeover').style.opacity)},get frontOpacity(){return Number($('#front').style.opacity)},get scene(){return webgl},get progress(){return p},get chapter(){return current},get plateReady(){return plateReady},get heroReady(){return heroReady},get liveActive(){return live.classList.contains('active')},get photoOnly(){return photoEnabled},get dragX(){return dragX}};
window.attachCoaster=api=>{webgl=api;mode.disabled=false;mode.textContent='LIVE 3D ON';};
window.coasterFailed=()=>{mode.disabled=true;mode.textContent='PHOTO MODE';$('#fallback').hidden=false;};
addEventListener('error',e=>{if(e.target?.tagName==='SCRIPT'&&!webgl)window.coasterFailed();},true);
mode.onclick=()=>{photoEnabled=!photoEnabled;mode.textContent=photoEnabled?'LIVE 3D OFF':'LIVE 3D ON';mode.setAttribute('aria-pressed',String(!photoEnabled));};
addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();mx=clamp((e.clientX-r.left)/r.width-.5,-.5,.5);my=clamp((e.clientY-r.top)/r.height-.5,-.5,.5);if(drag){dragX=clamp(drag.x+(e.clientX-drag.sx)*.009,-1.1,1.1);dragY=clamp(drag.y+(e.clientY-drag.sy)*.009,-.8,.8)}});
live.addEventListener('pointerdown',e=>{if(!live.classList.contains('active'))return;drag={sx:e.clientX,sy:e.clientY,x:dragX,y:dragY};live.setPointerCapture(e.pointerId);});
live.addEventListener('pointerup',()=>drag=null);live.addEventListener('pointercancel',()=>drag=null);live.addEventListener('dblclick',()=>{dragX=dragY=0;});
let platesDrawn=false;
const clean2=$('#clean2'),takeover=$('#takeover'),front=$('#front'),contactShadow=$('#contactShadow');
function drawClean(target,source){target.width=source.width;target.height=source.height;target.getContext('2d').drawImage(source,0,0);}
function renderFrame(now){
 const dt=Math.min(.12,Math.max(.001,(now-last)/1000));last=now;
 const wanted=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));
 p=reduce?wanted:mix(p,wanted,1-Math.exp(-dt/.17));if(Math.abs(p-wanted)<.00004)p=wanted;
 // All layers and the camera use the same progress. Crossfades use source-over
 // compositing on an opaque base, rather than fading both backgrounds to black.
 const studio=ease(.105,.255,p),touch=ease(.395,.485,p),macro=ease(.615,.705,p),ritual=ease(.815,.925,p);
 const idx=p<.18?0:p<.44?1:p<.66?2:p<.87?3:4;
 if(idx!==current||!$('#mobileCopy h1').textContent){current=idx;$('#mobileCopy h1').textContent=data[idx][1];$('#mobileCopy p').textContent=data[idx][2];nav.forEach((b,i)=>b.setAttribute('aria-current',String(i===idx)));$('#next').textContent=idx===4?'REPLAY ↑':'NEXT ↓';}
 images[0].style.opacity=1;images[1].style.opacity=studio;
 images[2].style.opacity=1;images[3].style.opacity=macro;images[4].style.opacity=ritual;
 front.style.opacity=touch;
 for(let i=0;i<2;i++)images[i].style.transform='none';
 // Calm push-in through the human-scale photograph, then a pull-back from macro.
 const touchZoom=reduce?1:1+.065*ease(.48,.65,p);
 const macroZoom=reduce?1:1+.045*(1-ease(.705,.84,p));
 const ritualZoom=reduce?1:1+.022*(1-ease(.925,1,p));
 images[2].style.transform='scale('+touchZoom+')';images[3].style.transform='scale('+macroZoom+')';images[4].style.transform='scale('+ritualZoom+')';
 const can3d=!!webgl&&plateReady&&heroReady&&!photoEnabled;
 if(can3d&&!platesDrawn){drawClean(clean,heroPlate);drawClean(clean2,objectPlate);platesDrawn=true;}
 const reveal=can3d?ease(.012,.055,p):0;
 // The SAME renderer and geometry remain visible from workshop through studio.
 // The touch photograph covers the complete composite; no second 3D hand.
 takeover.style.opacity=reveal;clean2.style.opacity=studio;
 const liveVisible=reveal*(1-touch),useLive=liveVisible>.003;
 live.classList.toggle('active',liveVisible>.93);live.style.cursor=drag?'grabbing':'grab';
 const settle=ease(.345,.415,p);if(!drag){const release=!useLive||settle>.01?1-Math.exp(-dt*(3+settle*9)):0;dragX=mix(dragX,0,release);dragY=mix(dragY,0,release);}
 contactShadow.style.left=(mix(.559,.597,studio)*100)+'%';contactShadow.style.top=(72-studio*7)+'%';contactShadow.style.opacity=(1-studio)*.25;
 if(useLive){try{webgl.draw(p,reduce?0:mx,reduce?0:my,dragX*(1-settle),dragY*(1-settle),dt);}catch(e){console.warn('Live render fallback',e);webgl=null;window.coasterFailed();takeover.style.opacity=0;live.classList.remove('active');}}
 $('#hint').firstChild.nodeValue=useLive?'DRAG TO ROTATE · SCROLL TO EXPLORE':'SCROLL TO EXPLORE';$('#livehint').textContent=useLive?'CONTINUOUS LIVE 3D':'PHOTOGRAPHIC CHAPTER / 0'+(idx+1);
 $('#replay').classList.toggle('on',idx===4);$('#progress').style.width=(wanted*100)+'%';requestAnimationFrame(renderFrame);
}
requestAnimationFrame(renderFrame);
</script>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
try{
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setClearColor(0x000000,0);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;live.append(renderer.domElement);
const scene=new T.Scene();const camera=new T.OrthographicCamera(-10,10,6,-6,.1,100);const root=new T.Group();scene.add(root);
const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.05).texture;scene.environmentIntensity=.33;room.dispose();
const key=new T.DirectionalLight(0xffe1bc,2.05);key.position.set(-6,12,-8);scene.add(key,new T.HemisphereLight(0xffe6c9,0x51301b,.48));
const rim=new T.DirectionalLight(0xffd4a0,1.1);rim.position.set(5,6,8);scene.add(rim);
const g=await new GLTFLoader().loadAsync('../assets/workshop-v04/workshop.glb'),product=g.scene.getObjectByName('CoasterProduct');if(!product)throw Error('Missing original model');
g.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(product),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());root.attach(product);product.position.sub(center);const scale=9/Math.max(size.x,size.z);root.scale.setScalar(scale);
const mats=new Set();product.traverse(o=>{if(o.isMesh){for(const m of [].concat(o.material)){mats.add(m);m.roughness=.96;m.metalness=0;m.envMapIntensity=.18;m.color.set('#b99a79');if(m.normalScale)m.normalScale.set(.65,.65);m.needsUpdate=true;}}});
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,Math.round(r.width)),Math.max(1,Math.round(r.height)),false);}new ResizeObserver(resize).observe(stage);resize();
new RGBELoader().loadAsync('../assets/workshop-v04/studio.hdr').then(h=>{const old=scene.environment;scene.environment=pmrem.fromEquirectangular(h).texture;old.dispose();h.dispose();pmrem.dispose()}).catch(()=>pmrem.dispose());
let yaw=0,pitch=0;
// Camera poses are all expressed in the same scene coordinates.
const poses=[
 [0,.559,.481,16.45,1.55,0,0,0],
 [.065,.559,.481,16.45,1.55,0,0,0],
 [.15,.578,.472,14.65,1.41,.18,.14,-.045],
 [.26,.597,.481,12.85,1.48,.04,.26,-.04],
 [.33,.597,.481,12.75,1.42,.12,.40,-.02],
 [.415,.500,.450,16.4,1.52,0,0,0],
 [.485,.500,.450,16.4,1.52,0,0,0]
];
function poseAt(p){let i=0;while(i<poses.length-2&&p>poses[i+1][0])i++;const a=poses[i],b=poses[i+1],t=ease(a[0],b[0],p);return a.slice(1).map((v,j)=>mix(v,b[j+1],t));}

}
window.attachCoaster({renderer,scene,camera,root,product,draw});
}catch(e){console.warn('Live 3D unavailable',e);window.coasterFailed();}

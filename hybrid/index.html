<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>COASTER. — Hybrid experience</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#130e09;color:#f4e5cf;font:15px/1.4 Arial,Helvetica,sans-serif;overflow-x:hidden}#track{height:780vh}#viewport{position:fixed;inset:0;display:grid;place-items:center;overflow:hidden;background:#130e09}#stage{position:relative;width:min(100vw,177.77778svh);aspect-ratio:16/9;max-height:100svh;overflow:hidden;isolation:isolate;background:#18110b;box-shadow:0 0 100px #0006}#plates,#plates img,#clean,#live,#curtain{position:absolute;inset:0;width:100%;height:100%}#plates img,#clean{object-fit:fill;pointer-events:none;opacity:0;will-change:opacity,transform;transform-origin:58% 48%}#plates img:first-child{opacity:1}#clean{z-index:2}#live{z-index:3;pointer-events:none;opacity:0}#live canvas{width:100%;height:100%;display:block;touch-action:pan-y}#live.active{pointer-events:auto}#curtain{z-index:4;opacity:0;background:#160e08;pointer-events:none}#grain{position:absolute;inset:0;pointer-events:none;z-index:4;background:radial-gradient(ellipse at center,transparent 55%,#0c07042e 100%);opacity:.25}button,a{font:inherit;color:inherit}button{cursor:pointer}.hit{position:absolute;top:2.5%;height:6.5%;padding:0;border:0;background:transparent;cursor:pointer;z-index:6}.hit:focus-visible{outline:2px solid #f4e5cf}.hit:hover{border-bottom:1px solid #f4e5cf}.product{left:70%;width:6.6%}.materials{left:77%;width:7.2%}.story{left:84.5%;width:6.4%}.contact{left:91.5%;width:7%}#nav{position:fixed;z-index:10;right:24px;bottom:24px;display:flex;gap:5px;padding:7px;border:1px solid #f4e5cf40;border-radius:40px;background:#17110bbd;backdrop-filter:blur(10px)}#nav button{width:36px;height:36px;border:0;border-radius:50%;background:transparent;color:#e2c9ad;font:11px monospace}#nav button[aria-current=true]{background:#f4e5cf;color:#1a120b}#nav button:focus-visible,#mode:focus-visible,#next:focus-visible{outline:2px solid #d9ad7b;outline-offset:4px}#mode{position:fixed;z-index:11;top:20px;left:50%;transform:translateX(-5 <body><main id="track" aria-label="Five scroll-driven chapters"><h1 class="sr">COASTER. A photographic and live 3D study</h1></main><div id="viewport"><div id="stage"><div id="plates"></div><canvas id="clean" aria-hidden="true"></canvas><div id="live" aria-label="Live 3D coaster"></div><div id="curtain"></div><div id="grain"></div><div id="fallback" hidden>Photo mode · WebGL unavailable</div><button class="hit product" data-go="1" aria-label="Product"></button><button class="hit materials" data-go="3" aria-label="Materials"></button><button class="hit story" data-go="2" aria-label="Touch"></button><button class="hit contact" data-go="4" aria-label="Ritual"></button><button id="replay" aria-label="Experience again"></button></div><div id="mobileCopy"><h1></h1><p></p></div></div><div id="progress"></div><button id="mode" aria-pressed="true" disabled>LOADING 3D</button><a id="credit" href="../photo/">PHOTO EDITION ↗</a><nav id="nav" aria-label="Chapters"></nav><button id="next">NEXT ↓</button><div id="hint">SCROLL TO EXPLORE<span id="livehint">PHOTOGRAPHIC INTRO</span></div>
<script>
const $=s=>document.querySelector(s),stage=$('#stage'),plates=$('#plates'),clean=$('#clean'),live=$('#live'),mode=$('#mode'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const data=[
['01-workshop.png','Coaster.','The beauty of the ordinary.'],
['02-object.png','Nothing to add.','Pure cork. Nothing else.'],
['03-touch.png','Made to be held.','A study in human scale and touch.'],
['04-material.png','Nature, up close.','The natural character of cork, revealed in detail.'],
['05-ritual.png','Make time for the little things.','Simple, thoughtful pieces for a more peaceful everyday.']];
const stops=[0,.245,.48,.685,.91],images=[],nav=[];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v)),ease=(a,b,x)=>{const t=clamp((x-a)/(b-a));return t*t*(3-2*t)},mix=(a,b,t)=>a+(b-a)*t;
let current=0,p=0,last=performance.now(),mx=0,my=0,photoEnabled=false,webgl=null,dragX=0,dragY=0,drag=null,plateReady=false,heroReady=false;
const source='../photo/assets/';
for(const [i,d] of data.entries()){const im=new Image();im.alt=d[1]+' — '+d[2];im.decoding='async';im.src=source+d[0];plates.append(im);images.push(im);const b=document.createElement('button');b.textContent='0'+(i+1);b.setAttribute('aria-label',d[1]);b.onclick=()=>go(i);$('#nav').append(b);nav.push(b);}
function go(i){scrollTo({top:stops[clamp(i,0,4)]*Math.max(1,document.documentElement.scrollHeight-innerHeight),behavior:reduce?'auto':'smooth'});}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>go(+b.dataset.go));$('#replay').onclick=()=>go(0);$('#next').onclick=()=>go(current===4?0:current+1);
addEventListener('keydown',e=>{if(/INPUT|BUTTON|A/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
function ready(im){return im.complete&&im.naturalWidth?Promise.resolve():new Promise((res,rej)=>{im.addEventListener('load',res,{once:true});im.addEventListener('error',rej,{once:true})})}
// Remove the isolated product from the photograph, keeping its original typography,
// ambient light and the photographic shadow underneath. Interpolate smooth dark backdrop
// from the visible sides of the silhouette rather than drawing a second product.
let objectPlate;
async function prepareObjectPlate(){await ready(images[1]);const im=images[1],c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);const image=ctx.getImageData(0,0,c.width,c.height),w=c.width,h=c.height,d=image.data,src=new Uint8ClampedArray(d);
const cx=.597*w,cy=.481*h,rx=.205*w,ry=.373*h;
for(let y=Math.max(0,Math.floor(cy-ry));y<Math.min(h,Math.ceil(cy+ry));y++){
 const dy=(y-cy)/ry;if(Math.abs(dy)>=1)continue;const half=rx*Math.sqrt(1-dy*dy),lo=Math.max(0,Math.floor(cx-half)),hi=Math.min(w-1,Math.ceil(cx+half));if(hi<=lo)continue;
 const a=Math.max(0,lo-Math.round(w*.018)),b=Math.min(w-1,hi+Math.round(w*.018));
 for(let x=lo;x<=hi;x++){const r=Math.hypot((x-cx)/rx,dy),edge=1-ease(.94,1,r),t=(x-a)/Math.max(1,b-a),i=(y*w+x)*4,ia=(y*w+a)*4,ib=(y*w+b)*4;for(let k=0;k<3;k++)d[i+k]=mix(src[i+k],mix(src[ia+k],src[ib+k],t),edge);}
}
ctx.putImageData(image,0,0);objectPlate=c;plateReady=true;}
prepareObjectPlate().catch(()=>{plateReady=false});
Promise.all(images.map(ready)).catch(()=>{$('#fallback').hidden=false;$('#fallback').textContent='Some images failed to load.'});
window.hybrid={get scene(){return webgl},get progress(){return p},get chapter(){return current},get plateReady(){return plateReady},get liveActive(){return live.classList.contains('active')},get photoOnly(){return photoEnabled},get dragX(){return dragX}};
window.attachCoaster=api=>{webgl=api;mode.disabled=false;mode.textContent='LIVE 3D ON';};
window.coasterFailed=()=>{mode.disabled=true;mode.textContent='PHOTO MODE';$('#fallback').hidden=false;};
mode.onclick=()=>{photoEnabled=!photoEnabled;mode.textContent=photoEnabled?'LIVE 3D OFF':'LIVE 3D ON';mode.setAttribute('aria-pressed',String(!photoEnabled));};
addEventListener('pointermove',e=>{const r=stage.getBoundingClientRect();mx=clamp((e.clientX-r.left)/r.width-.5,-.5,.5);my=clamp((e.clientY-r.top)/r.height-.5,-.5,.5);if(drag){dragX=clamp(drag.x+(e.clientX-drag.sx)*.009,-1.1,1.1);dragY=clamp(drag.y+(e.clientY-drag.sy)*.009,-.8,.8)}});
live.addEventListener('pointerdown',e=>{if(!live.classList.contains('active'))return;drag={sx:e.clientX,sy:e.clientY,x:dragX,y:dragY};live.setPointerCapture(e.pointerId);});
live.addEventListener('pointerup',()=>drag=null);live.addEventListener('pointercancel',()=>drag=null);live.addEventListener('dblclick',()=>{dragX=dragY=0;});
let cleanDrawn=false;
function renderFrame(now){const dt=Math.min(.1,Math.max(.001,(now-last)/1000));last=now;const wanted=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));p=reduce?wanted:mix(p,wanted,1-Math.exp(-dt/.19));if(Math.abs(p-wanted)<.00004)p=wanted;
 const weights=[1-ease(.12,.205,p),ease(.12,.205,p)*(1-ease(.355,.455,p)),ease(.355,.455,p)*(1-ease(.56,.645,p)),ease(.56,.645,p)*(1-ease(.765,.855,p)),ease(.765,.855,p)];
 const idx=weights.indexOf(Math.max(...weights));if(idx!==current||!$('#mobileCopy h1').textContent){current=idx;$('#mobileCopy h1').textContent=data[idx][1];$('#mobileCopy p').textContent=data[idx][2];nav.forEach((b,i)=>b.setAttribute('aria-current',String(i===idx)));$('#next').textContent=idx===4?'REPLAY ↑':'NEXT ↓';}
 // Fully live product during the second chapter. Fade the photographic original
 // out before revealing its empty plate, preventing two superimposed coasters.
 const can3d=!!webgl&&plateReady&&!photoEnabled;
 const liveIn=can3d?ease(.195,.222,p)*(1-ease(.335,.365,p)):0;
 const useLive=liveIn>.001;
 if(useLive&&!cleanDrawn&&objectPlate){clean.width=objectPlate.width;clean.height=objectPlate.height;clean.getContext('2d').drawImage(objectPlate,0,0);cleanDrawn=true;}
 for(let i=0;i<images.length;i++){images[i].style.opacity=weights[i];const amount=reduce?0:(i===0||i===1?0:.025);const local=clamp((p-stops[i])/.2,-1,1);images[i].style.transform='scale('+(1+amount*(.5+.5*local))+') translate('+(-mx*amount*20)+'px,'+(-my*amount*20)+'px)';}
 clean.style.opacity=liveIn;live.style.opacity=liveIn;live.classList.toggle('active',liveIn>.98);live.style.cursor=drag?'grabbing':'grab';
 // At the two takeover points a brief dip-to-black hides the geometry/photo seam.
 const seam=can3d?Math.max(ease(.185,.199,p)*(1-ease(.199,.225,p)),ease(.333,.350,p)*(1-ease(.350,.371,p))):0;
 $('#curtain').style.opacity=reduce?0:seam*.83;
 if(useLive){const local=clamp((p-.222)/.113);webgl.draw(local,reduce?0:mx,reduce?0:my,dragX,dragY,dt);}
 if(idx!==1&&!drag){dragX=mix(dragX,0,1-Math.exp(-dt*5));dragY=mix(dragY,0,1-Math.exp(-dt*5));}
 $('#hint').firstChild.nodeValue=useLive?'DRAG TO ROTATE · SCROLL TO MOVE':'SCROLL TO EXPLORE';$('#livehint').textContent=useLive?'LIVE WEBGL PRODUCT':'PHOTOGRAPHIC CHAPTER / 0'+(idx+1);$('#replay').classList.toggle('on',idx===4);$('#progress').style.width=(wanted*100)+'%';requestAnimationFrame(renderFrame);}
requestAnimationFrame(renderFrame);
</script>
<script type="module">
import * as T from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {RGBELoader} from 'three/addons/loaders/RGBELoader.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
try{
const renderer=new T.WebGLRenderer({alpha:true,antialias:true,powerPreference:'high-performance'});renderer.setClearColor(0x000000,0);renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;live.append(renderer.domElement);
const scene=new T.Scene();const camera=new T.OrthographicCamera(-10,10,6,-6,.1,100);const root=new T.Group();scene.add(root);
const pmrem=new T.PMREMGenerator(renderer),room=new RoomEnvironment();scene.environment=pmrem.fromScene(room,.05).texture;scene.environmentIntensity=.33;room.dispose();
const key=new T.DirectionalLight(0xffe1bc,2.05);key.position.set(-6,12,-8);scene.add(key,new T.HemisphereLight(0xffe6c9,0x51301b,.48));
const rim=new T.DirectionalLight(0xffd4a0,1.1);rim.position.set(5,6,8);scene.add(rim);
const g=await new GLTFLoader().loadAsync('../assets/workshop-v04/workshop.glb'),product=g.scene.getObjectByName('CoasterProduct');if(!product)throw Error('Missing original model');
g.scene.updateMatrixWorld(true);const box=new T.Box3().setFromObject(product),center=box.getCenter(new T.Vector3()),size=box.getSize(new T.Vector3());root.attach(product);product.position.sub(center);const scale=9/Math.max(size.x,size.z);root.scale.setScalar(scale);
const mats=new Set();product.traverse(o=>{if(o.isMesh){for(const m of [].concat(o.material)){mats.add(m);m.roughness=.96;m.metalness=0;m.envMapIntensity=.18;m.color.set('#b99a79');if(m.normalScale)m.normalScale.set(.65,.65);m.needsUpdate=true;}}});
function resize(){const r=stage.getBoundingClientRect();renderer.setSize(Math.max(1,Math.round(r.width)),Math.max(1,Math.round(r.height)),false);}new ResizeObserver(resize).observe(stage);resize();
new RGBELoader().loadAsync('../assets/workshop-v04/studio.hdr').then(h=>{const old=scene.environment;scene.environment=pmrem.fromEquirectangular(h).texture;old.dispose();h.dispose();pmrem.dispose()}).catch(()=>pmrem.dispose());
let yaw=0,pitch=0;
function draw(t,x,y,dx,dy,dt){
 // The original GLB geometry is rendered with actual lighting, normals and moving perspective.
 // The stationary approved background keeps its built-in typography.
 const a=1-Math.exp(-Math.max(.001,dt)*11);
 yaw=T.MathUtils.lerp(yaw,dx+x*.23,a);pitch=T.MathUtils.lerp(pitch,dy+y*.17,a);
 const bend=reduce?0:Math.sin(t*Math.PI)*.44;
 root.rotation.set(bend+pitch, yaw+(reduce?0:t*.55),reduce?0:Math.sin(t*Math.PI)*-.12);
 const elevation=reduce?1.49:1.49-.17*Math.sin(t*Math.PI);
 camera.position.set(0,Math.sin(elevation)*25,Math.cos(elevation)*25);
 camera.up.set(0,1,0);camera.lookAt(0,0,0);
 const height=T.MathUtils.lerp(12.85,11.9,reduce?0:Math.sin(t*Math.PI)),width=height*16/9;
 // Match the center of the original isolated product image.
 const cx=.597,cy=.481;
 camera.left=-cx*width;camera.right=(1-cx)*width;camera.top=cy*height;camera.bottom=-(1-cy)*height;camera.updateProjectionMatrix();
 renderer.render(scene,camera);
}
window.attachCoaster({renderer,scene,camera,root,product,draw});
}catch(e){console.warn('Live 3D unavailable',e);window.coasterFailed();}
</script></body></html>

<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>COASTER. — Photographic edition</title>
<style>
*{box-sizing:border-box}html{scroll-behavior:auto}body{margin:0;background:#17110b;color:#f5e8d3;font:15px/1.5 Arial,Helvetica,sans-serif}main{position:relative}.chapter{min-height:155svh;position:relative}.frame{position:sticky;top:0;height:100svh;display:grid;place-items:center;overflow:hidden;background:#17110b}.art{position:relative;width:min(100vw,177.7778svh);aspect-ratio:16/9;max-height:100svh;overflow:hidden;box-shadow:0 0 100px #0006}.art img{display:block;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .65s}.art img.loaded{opacity:1}.missing{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:24px;background:radial-gradient(ellipse,#63472e,#17110b 75%)}.missing[hidden]{display:none}.missing h2{font-size:clamp(30px,5vw,80px);line-height:1;letter-spacing:-.06em;margin:0 0 10px}.missing p{max-width:380px;color:#d8c1a5}.hit{position:absolute;top:2.5%;height:6.5%;padding:0;border:0;background:transparent;cursor:pointer;border-radius:3px}.hit:focus-visible{outline:2px solid #f5e8d3;outline-offset:3px}.hit:hover{box-shadow:inset 0 -1px #f5e8d3}.product{left:70%;width:6.6%}.materials{left:77%;width:7.2%}.story{left:84.5%;width:6.4%}.contact{left:91.5%;width:7%}.explore{top:63%;left:4%;width:16%;height:8%}.chapter:last-child{min-height:100svh}.shade{position:absolute;inset:0;pointer-events:none;background:#17110b;opacity:0}.nav{position:fixed;z-index:10;right:24px;bottom:24px;display:flex;gap:6px;align-items:center;padding:8px;border:1px solid #f5e8d344;border-radius:40px;background:#17110bc9;backdrop-filter:blur(12px)}button,a{color:inherit;font:inherit}button{cursor:pointer}.nav button{width:35px;height:35px;border:0;border-radius:50%;background:transparent;color:#e5cbb0;font:11px monospace}.nav button[aria-current=true]{background:#f5e8d3;color:#17110b}.nav button:hover{outline:1px solid #f5e8d366}.utility{position:fixed;z-index:11;top:12px;left:12px;display:flex;gap:5px}.utility button,.utility a{background:#17110bd9;border:1px solid #f5e8d344;padding:7px 10px;border-radius:3px;text-decoration:none;font:11px monospace}.utility:not(:hover):not(:focus-within){opacity:.6}.mobile-copy{display:none}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}#dialog{position:fixed;z-index:20;inset:0;display:grid;place-items:center;background:#000b;padding:20px}#dialog[hidden]{display:none}.sheet{width:min(560px,100%);max-height:90vh;overflow:auto;padding:26px;background:#241a12;border:1px solid #f5e8d355;border-radius:12px}.sheet h2{margin:0 0 8px;font-size:25px}.sheet p{color:#d9c6af}.slot{display:grid;grid-template-columns:1fr minmax(0,1fr);gap:10px;align-items:center;border-top:1px solid #f5e8d322;padding:10px 0;font-size:13px}.slot input{width:100%;font-size:12px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{border:1px solid #f5e8d355;background:none;padding:10px 14px;border-radius:4px}.actions button:first-child{background:#f5e8d3;color:#17110b}#notice{font-size:12px;color:#d8c1a5}.progress{position:fixed;left:0;top:0;height:2px;background:#f5e8d3;z-index:12;width:0}.next{position:fixed;left:24px;bottom:24px;z-index:10;background:#17110b99;border:1px solid #f5e8d344;border-radius:40px;padding:9px 15px;font:11px monospace;letter-spacing:.08em}.next[hidden]{display:none}
@media(max-aspect-ratio:4/5){.chapter{min-height:135svh}.frame{display:flex;flex-direction:column;justify-content:center;gap:18px;padding:65px 0 92px}.art{width:100%;height:auto;max-height:none;aspect-ratio:16/9}.mobile-copy{display:block;width:88%;margin:0 auto}.mobile-copy h2{font-size:clamp(28px,8vw,46px);line-height:1;letter-spacing:-.04em;margin:0 0 8px}.mobile-copy p{font-size:14px;color:#d9c6af;margin:0}.hit{display:none}.utility{top:10px;left:10px}.nav{right:12px;bottom:14px;gap:3px;padding:5px}.nav button{width:31px;height:31px}.next{left:12px;bottom:14px;font-size:10px}.chapter:last-child{min-height:100svh}}
@media(prefers-reduced-motion:reduce){.art img{transition:none}}
</style></head><body>
<div class="progress" id="progress"></div>
<div class="utility"><button id="open">PODKLADY / ASSETS</button><a href="../v11/">LIVE 3D ↗</a></div>
<main id="chapters"></main>
<nav class="nav" aria-label="Kapitoly" id="nav"></nav><button class="next" id="next">DALŠÍ ↓</button>
<div id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" hidden><div class="sheet"><h2 id="dialog-title">Pět schválených vizuálů</h2><p>Vyber původní obrázky v pořadí Workshop, Object, Touch, Material, Ritual. Náhled je lokální, soubory se nikam neodesílají. Publikované obrázky stránka načítá automaticky.</p><label style="display:block;padding:14px 0;border-top:1px solid #f5e8d344">Vyber všech 5 originálů najednou (bez přejmenování)<input id="batch" type="file" accept="image/png,image/jpeg,image/webp" multiple style="display:block;margin-top:8px;width:100%"></label><div id="slots"></div><p><a href="https://github.com/mara420/Oryzo-study/upload/main/photo/assets" target="_blank" rel="noopener">Nahrát všech 5 originálů na GitHub ↗</a></p><div class="actions"><button id="close">Zobrazit náhled</button><button id="clear">Obnovit soubory z webu</button></div><p id="notice" role="status"></p></div></div>
<script>
const chapters=[
{file:'01-workshop.png',title:'Coaster.',description:'The beauty of the ordinary.',alt:'Fotorealistický návrh pracovního stolu, korkový podtácek na zelené řezací podložce.'},
{file:'02-object.png',title:'Nothing to add.',description:'Pure cork. Nothing else.',alt:'Izolovaný korkový podtácek na tmavém pozadí.'},
{file:'03-touch.png',title:'Made to be held.',description:'A study in human scale and touch.',alt:'Ruka přirozeně drží podtácek; žádná animovaná geometrie.'},
{file:'04-material.png',title:'Nature, up close.',description:'The natural character of cork, revealed in detail.',alt:'Makrodetail porézního povrchu korku.'},
{file:'05-ritual.png',title:'Make time for the little things.',description:'Simple, thoughtful pieces for a more peaceful everyday.',alt:'Keramický šálek kávy na korkovém podtácku.'}];
const $=s=>document.querySelector(s),main=$('#chapters'),nav=$('#nav'),slots=$('#slots'),dialog=$('#dialog');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
let current=0,urls=[],images=[],sections=[],buttons=[];
function go(i){i=Math.max(0,Math.min(chapters.length-1,i));sections[i].scrollIntoView({behavior:reduce?'instant':'smooth',block:'start'});}
for(const [i,c] of chapters.entries()){
 const sec=document.createElement('section');sec.className='chapter';sec.id='chapter-'+(i+1);sec.setAttribute('aria-label',c.title);
 sec.innerHTML='<div class="frame"><div class="art"><img alt=""><div class="missing"><h2></h2><p>Vizuál zatím není nahraný. Použij tlačítko PODKLADY / ASSETS.</p></div><div class="shade"></div></div><div class="mobile-copy"><h2></h2><p></p></div></div>';
 const img=sec.querySelector('img');img.alt=c.alt;img.decoding='async';img.loading='eager';sec.querySelector('.missing h2').textContent=c.title;sec.querySelector('.mobile-copy h2').textContent=c.title;sec.querySelector('.mobile-copy p').textContent=c.description;
 img.onload=()=>{img.classList.add('loaded');sec.querySelector('.missing').hidden=true};img.onerror=()=>{img.classList.remove('loaded');sec.querySelector('.missing').hidden=false};
 img.src='./assets/'+c.file;
 for(const [cls,idx,label] of [['product',1,'Product'],['materials',3,'Materials'],['story',2,'Story / Journal'],['contact',4,'Closing chapter']]){const btn=document.createElement('button');btn.className='hit '+cls;btn.setAttribute('aria-label',label);btn.onclick=()=>go(idx);sec.querySelector('.art').append(btn);}
 if(i===4){const replay=document.createElement('button');replay.className='hit explore';replay.setAttribute('aria-label','Explore more — return to start');replay.onclick=()=>go(0);sec.querySelector('.art').append(replay);}
 main.append(sec);images.push(img);sections.push(sec);
 const btn=document.createElement('button');btn.textContent=String(i+1).padStart(2,'0');btn.setAttribute('aria-label',c.title);btn.onclick=()=>go(i);nav.append(btn);buttons.push(btn);
 const row=document.createElement('label');row.className='slot';row.textContent=(i+1)+' / '+c.title;const file=document.createElement('input');file.type='file';file.accept='image/*';file.onchange=()=>{const f=file.files[0];if(!f)return;if(urls[i])URL.revokeObjectURL(urls[i]);urls[i]=URL.createObjectURL(f);img.src=urls[i];$('#notice').textContent='Vybráno '+urls.filter(Boolean).length+' / 5 obrázků pro lokální náhled.'};row.append(file);slots.append(row);
}
const originalSizes=[2665281,1968632,2215514,2039068,1989872];
$('#batch').onchange=()=>{
 const files=Array.from($('#batch').files);let matched=0,unmatched=0;
 for(const f of files){let i=chapters.findIndex(c=>c.file===f.name);if(i<0)i=originalSizes.indexOf(f.size);
 if(i<0){unmatched++;continue}
 if(urls[i])URL.revokeObjectURL(urls[i]);urls[i]=URL.createObjectURL(f);images[i].src=urls[i];matched++;
 }
 $('#notice').textContent='Rozpoznáno '+matched+' / '+files.length+' obrázků. '+(unmatched?'U upravených souborů vyber správnou kapitolu ručně.':'Pořadí bylo přiřazeno automaticky.');
};
function update(){const y=scrollY,range=Math.max(1,document.documentElement.scrollHeight-innerHeight);$('#progress').style.width=(Math.min(1,y/range)*100)+'%';let index=0;for(let i=0;i<sections.length;i++)if(sections[i].getBoundingClientRect().top<innerHeight*.48)index=i;current=index;buttons.forEach((b,i)=>b.setAttribute('aria-current',String(i===index)));$('#next').textContent=index===4?'ZNOVU ↑':'DALŠÍ ↓';for(let i=0;i<sections.length-1;i++){const rect=sections[i].getBoundingClientRect();const t=Math.max(0,Math.min(1,(innerHeight-rect.bottom)/(.4*innerHeight)));sections[i].querySelector('.shade').style.opacity=reduce?0:t*.55}}
let scheduled=false;function tick(){if(!scheduled){scheduled=true;requestAnimationFrame(()=>{scheduled=false;update()})}}
addEventListener('scroll',tick,{passive:true});addEventListener('resize',tick);update();$('#next').onclick=()=>go(current===4?0:current+1);
function open(){dialog.hidden=false;$('#close').focus()}function close(){dialog.hidden=true;$('#open').focus()}
$('#open').onclick=open;$('#close').onclick=close;$('#clear').onclick=()=>{for(const [i,img] of images.entries()){if(urls[i])URL.revokeObjectURL(urls[i]);img.src='./assets/'+chapters[i].file}urls=[];slots.querySelectorAll('input').forEach(el=>el.value='');$('#notice').textContent='Obnoveno načítání z GitHub Pages.'};
addEventListener('keydown',e=>{if(e.key==='Escape'&&!dialog.hidden){close();return}if(!dialog.hidden||/INPUT|BUTTON|A/.test(document.activeElement.tagName))return;if(e.key==='ArrowRight'){e.preventDefault();go(current+1)}if(e.key==='ArrowLeft'){e.preventDefault();go(current-1)}});
</script></body></html>

<script type="module">
import * as T from 'three';

try{const res=await fetch(rootPath+'manifest.json');if(!res.ok)throw Error('New baked asset not published');const m=await res.json();if(m.version!==2)throw Error('Manifest mismatch');gltf=await loader.loadAsync(rootPath+'workshop.glb',e=>{if(e.total)$('#loading').textContent='Loading baked world '+Math.round(e.loaded/e.total*100)+'%'});baked=true;}
catch(e){console.info('Using existing real spatial workshop until baked export is available',e.message);gltf=await loader.loadAsync('../assets/workshop-v04/workshop.glb',e=>{if(e.total)$('#loading').textContent='Loading spatial world '+Math.round(e.loaded/e.total*100)+'%'});}
const desk=gltf.scene;scene.add(desk);desk.updateMatrixWorld(true);
const product=desk.getObjectByName('CoasterProduct');if(!product)throw Error('Product mesh missing');
const bounds=new T.Box3().setFromObject(product),pivot=new T.Group();pivot.name='ContinuousProduct';pivot.position.copy(bounds.getCenter(new T.Vector3()));scene.add(pivot);pivot.updateMatrixWorld(true);pivot.attach(product);const base=pivot.position.clone(),size=bounds.getSize(new T.Vector3()),radius=Math.max(size.x,size.z)/2;
let staticMeshes=0,bakedMeshes=0;
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9]/g,'');
desk.traverse(o=>{if(!o.isMesh)return;staticMeshes++;const name=norm(o.name),mats=[].concat(o.material||[]),ground=/woodenworksurface|bakedwood|^mat|bakedmat|gridvertical|gridhorizontal/.test(name);
if(baked&&mats.every(m=>/baked/.test(norm(m.name))&&m.map)){const conv=m=>new T.MeshBasicMaterial({map:m.map,color:0xffffff,toneMapped:false,side:m.side});o.material=Array.isArray(o.material)?mats.map(conv):conv(mats[0]);bakedMeshes++;o.castShadow=false;o.receiveShadow=false;}
else{o.castShadow=!ground;o.receiveShadow=true;for(const m of mats){if(/cuttingmat/.test(norm(m.name)))m.color.set('#38442e');if(/fadedprintedgrid/.test(norm(m.name)))m.color.set('#777659');if(m.normalScale)m.normalScale.multiplyScalar(.75);m.needsUpdate=true;}}});
const productMats=new Set();product.traverse(o=>{if(!o.isMesh)return;o.castShadow=true;o.receiveShadow=true;for(const m of [].concat(o.material||[])){productMats.add(m);m.color.set('#d5b08a');m.roughness=.91;m.metalness=0;m.envMapIntensity=.26;if(m.normalScale)m.normalScale.set(.8,.8);m.needsUpdate=true;}});

// remains geometry and its own static shadows remain baked. No photo plate.
const receiver=new T.Mesh(new T.PlaneGeometry(27,19),new T.ShadowMaterial({opacity:.29,depthWrite:false}));receiver.rotation.x=-Math.PI/2;receiver.position.set(4.8,.103,-.5);receiver.rotation.z=-Math.PI/36;receiver.receiveShadow=true;receiver.visible=baked;scene.add(receiver);
const env=new RGBELoader().loadAsync('../assets/workshop-v04/studio.hdr').then(h=>{const old=scene.environment;scene.environment=pmrem.fromEquirectangular(h).texture;old.dispose();h.dispose();pmrem.dispose()}).catch(()=>pmrem.dispose());
// Use the existing same CC0 maps on the same product throughout the shot.
(async()=>{try{const tl=new T.TextureLoader(),[color,normal,rough]=await Promise.all(['cork-color.jpg','cork-normal.jpg','cork-rough.jpg'].map(n=>tl.loadAsync('../assets/hero-v11/'+n)));
function inherit(old,src,cs){const t=old?old.clone():src.clone();t.source=new T.Source(src.image);t.flipY=false;t.colorSpace=cs;t.anisotropy=Math.min(8,renderer.capabilities.getMaxAnisotropy());t.needsUpdate=true;return t;}
for(const m of productMats){m.map=inherit(m.map,color,T.SRGBColorSpace);m.normalMap=inherit(m.normalMap||m.map,normal,T.NoColorSpace);m.roughnessMap=inherit(m.roughnessMap||m.map,rough,T.NoColorSpace);m.needsUpdate=true;}
}catch(e){console.warn('Keeping original cork maps',e);}})();
// Optional lens depth of field uses the SAME renderer, default disabled.
let composer=null,bokeh=null,film=false;try{composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,camera));bokeh=new BokehPass(scene,camera,{focus:30,aperture:.00065,maxblur:.004});composer.addPass(bokeh);composer.addPass(new OutputPass());$('#film').disabled=false;}catch(e){composer=null}
$('#film').onclick=()=>{if(!composer)return;film=!film;$('#film').textContent=film?'FOCUS ON':'FOCUS OFF';};
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();if(composer){composer.setPixelRatio(renderer.getPixelRatio());composer.setSize(innerWidth,innerHeight)}}addEventListener('resize',resize);resize();
// One world-space camera route. Every object stays in its actual 3D position.
// key: scroll, camera x/y/z, focus x/y/z, product lift, pitch, yaw, roll, fov
const keys=[
 [0,-3,32,2.5,0,.6,0,0,0,0,0,35],
 [.12,-6,26,8,0,.7,0,0,0,0,0,35],
 [.30,-9,13,18,0,.9,0,0,0,0,0,36],
 [.42,-6,9,15,0,1.5,0,.8,.05,.12,0,37],
 [.56,1,13,18,0,4.8,0,4.4,.18,.38,-.05,34],
 [.68,6,15,17,0,7.4,0,7.0,.38,.68,-.08,34],
 [.82,4,17,12,0,9.9,0,9.5,.58,1.04,-.04,32],
 [1,1,17,6.8,0,10.1,0,9.5,.26,1.24,-.02,29]
];
function tangent(i,j){if(i===0||i===keys.length-1)return 0;const a=keys[i-1],b=keys[i],c=keys[i+1],l=(b[j]-a[j])/(b[0]-a[0]),r=(c[j]-b[j])/(c[0]-b[0]);return l*r<=0?0:2*l*r/(l+r)}
function poseAt(p){let i=0;while(i<keys.length-2&&p>keys[i+1][0])i++;const a=keys[i],b=keys[i+1],h=b[0]-a[0],t=clamp((p-a[0])/h),t2=t*t,t3=t2*t;return a.slice(1).map((v,j)=>(2*t3-3*t2+1)*v+(t3-2*t2+t)*h*tangent(i,j+1)+(-2*t3+3*t2)*b[j+1]+(t3-t2)*h*tangent(i+1,j+1));}
let p=0,last=performance.now(),mx=0,my=0,drag=null,dx=0,dy=0,yaw=0,pitch=0,chapter=-1;
const labels=[['01 — WORKSHOP','Coaster.','The beauty of the ordinary.'],['02 — SPACE','A closer look.','Every object occupies real space.'],['03 — PRODUCT','Nothing to add.','Pure cork. Nothing else.'],['04 — DETAIL','Nature, up close.','A closer study of the material.']];
const target=new T.Vector3(),camOffset=new T.Vector3();let lastRenderP=-1;
addEventListener('pointermove',e=>{mx=e.clientX/innerWidth-.5;my=e.clientY/innerHeight-.5;if(drag){dx=clamp(drag.x+(e.clientX-drag.sx)*.008,-1.2,1.2);dy=clamp(drag.y+(e.clientY-drag.sy)*.008,-.6,.6)}});
renderer.domElement.addEventListener('pointerdown',e=>{if(p<.6||p>.86)return;drag={sx:e.clientX,sy:e.clientY,x:dx,y:dy};renderer.domElement.setPointerCapture(e.pointerId)});
for(const e of ['pointerup','pointercancel'])renderer.domElement.addEventListener(e,()=>drag=null);
renderer.domElement.addEventListener('dblclick',()=>{dx=dy=0});
function frame(now){if(renderer.getContext().isContextLost())return;
 const dt=Math.min(.12,Math.max(.001,(now-last)/1000));last=now;const wanted=clamp(scrollY/Math.max(1,document.documentElement.scrollHeight-innerHeight));p=reduced?wanted:mix(p,wanted,1-Math.exp(-dt/.16));if(Math.abs(p-wanted)<.00003)p=wanted;
 const k=poseAt(p),[cx,cy,cz,tx,ty,tz,lift,rx,ry,rz,fov]=k,dragWeight=ease(.57,.64,p)*(1-ease(.83,.91,p));if(dragWeight<.001&&!drag){dx=dy=0}
 const a=1-Math.exp(-dt*9);yaw=mix(yaw,dx*dragWeight+(reduced?0:mx*.10*dragWeight),a);pitch=mix(pitch,dy*dragWeight+(reduced?0:my*.07*dragWeight),a);
 pivot.position.copy(base);pivot.position.y+=lift;pivot.rotation.set(rx+pitch,ry+yaw,rz);
 target.set(base.x+tx,base.y+ty,base.z+tz);
 camera.position.set(base.x+cx,cy,base.z+cz);if(!reduced){camera.position.x+=mx*.42;camera.position.z+=my*.24;}
 // Mobile has the same real scene but a wider field and lower composition,

 const portrait=camera.aspect<.9;if(portrait){camOffset.copy(camera.position).sub(target).multiplyScalar(1.28);camera.position.copy(target).add(camOffset);}

 const sx=portrait?.50:mix(.61,.65,ease(.3,.65,p)),sy=portrait?.66:mix(.49,.52,ease(.8,1,p));

 key.target.position.copy(pivot.position);key.position.set(-10,19+lift*.45,7);key.intensity=mix(2,2.25,ease(.55,.8,p));rim.intensity=mix(.38,.9,ease(.55,.8,p));
 // The desk is NEVER translated away, hidden, or replaced by a photograph.

 const i=p<.20?0:p<.48?1:p<.86?2:3;
 if(i!==chapter){chapter=i;$('#eyebrow').textContent=labels[i][0];$('#headline').textContent=labels[i][1];$('#lead').textContent=labels[i][2];$('#number').textContent='0'+(i+1)+' / 04';nav.forEach((b,j)=>b.setAttribute('aria-current',String(i===j)));}
 const fade=Math.max(...[.20,.48,.86].map(t=>Math.max(0,1-Math.abs(p-t)/.028)));$('#copy').style.opacity=1-.88*fade;$('#copy').style.transform='translateY('+(-fade*8)+'px)';
 $('#cursorTip').classList.toggle('on',dragWeight>.85);renderer.domElement.style.cursor=drag?'grabbing':dragWeight>.85?'grab':'default';$('#bar i').style.width=(p*100)+'%';
 lastRenderP=p;requestAnimationFrame(frame);
}
ready=true;$('#status').hidden=true;$('#diagnostic').textContent=baked?'V2.0 · CYCLES BAKED WORLD':'V2.0 · ORIGINAL 3D WORLD';
window.worldStudy={renderer,scene,camera,desk,product,pivot,base,receiver,baked,staticMeshes,bakedMeshes,get progress(){return lastRenderP},get chapter(){return chapter},get film(){return film},get dragX(){return dx}};

}catch(e){console.error(e);fallback('Could not load spatial world: '+e.message)}
</script></body></html>

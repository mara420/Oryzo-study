name: Bake workshop lighting
on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/bake_workshop_lighting.py'
      - '.github/workflows/bake-workshop.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: workshop-light-bake
  cancel-in-progress: true
jobs:
  bake:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          name: workshop-reference
          run-id: 45719520519
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: reference
      - name: Install Blender
        run: |
          sudo apt-get update
          sudo apt-get install -y blender python3-pil
      - name: Bake illumination maps
        run: blender --background reference/workshop.blend --python-exit-code 1 --python tools/bake_workshop_lighting.py
      - name: Validate lighting textures
        run: |
          /usr/bin/python3 - <<'PY'
          from PIL import Image
          from pathlib import Path
          p=Path("assets/workshop-v06")
          for name in ("wood-ao","mat-ao","wood-irradiance","mat-irradiance"):
              with Image.open(p/(name+".png")) as im:
                  im.load()
                  assert im.size==(1024,1024)
                  lo,hi=im.convert("L").getextrema()
                  assert hi>lo, name+" has no lighting variation"
                  print(name, im.size, lo,hi)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workshop-lightmaps
          path: assets/workshop-v06/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish validated lighting maps
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/workshop-v06/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish baked workshop illumination maps'
          git pull --rebase origin main
          git push origin HEAD:main

name: Test V1.3 cinematic depth
on:
  workflow_dispatch:
  push:
    paths:
      - 'cinema/**'
      - '.github/workflows/test-cinema.yml'
permissions:
  contents: read
concurrency:
  group: cinema-browser-test
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify source syntax
        run: |
          python3 - <<'PY'
          import re, pathlib
          s=pathlib.Path("cinema/index.html").read_text()
          scripts=re.findall(r'<script(?: type="module")?>(.*?)</script>',s,re.S)
          assert len(scripts)==3
          for i,script in enumerate(scripts): pathlib.Path('/tmp/cinema-'+str(i)+'.mjs').write_text(script)
          PY
          node --check /tmp/cinema-0.mjs
          node --check /tmp/cinema-1.mjs
          node --check /tmp/cinema-2.mjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1 three@0.178.0
      - run: npx playwright install --with-deps chromium
      - name: Check uninterrupted 3D, reversible transitions and photography
        run: |
          python3 -m http.server 8765 >/tmp/oryzo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/cinema/ >/dev/null && break; sleep 1; done
          mkdir -p test-output
          cat > smoke-cinema.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try{
            for(const [name,viewport,motion] of [['desktop',{width:1100,height:619},'no-preference'],['mobile',{width:390,height:844},'reduce']]){
              const page=await browser.newPage({viewport,deviceScaleFactor:1,reducedMotion:motion}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));page.on('console',m=>{if(m.type()==='error'&&/Shader Error|VALIDATE_STATUS|GL_INVALID/.test(m.text()))errors.push(m.text())});
              const prefix='https://cdn.jsdelivr.net/npm/three@0.178.0/',root=path.resolve('node_modules/three');
              await page.route(prefix+'**',async r=>{const f=path.resolve(root,new URL(r.request().url()).pathname.split('/three@0.178.0/')[1]);if(!f.startsWith(root+path.sep))return r.abort();await r.fulfill({body:await fs.readFile(f),contentType:'application/javascript'});});
              await page.goto('http://127.0.0.1:8765/cinema/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.hybrid?.version==='1.2'&&hybrid.scene&&hybrid.heroReady&&hybrid.plateReady&&document.querySelectorAll('#plates img,#front img').length===5&&[...document.querySelectorAll('#plates img,#front img')].every(i=>i.complete&&i.naturalWidth>0),{},{timeout:120000});
              const shot=async s=>page.screenshot({path:'test-output/'+name+'-'+s+'.png',timeout:90000});
              const scroll=async p=>{await page.evaluate(p=>scrollTo({top:p*(document.documentElement.scrollHeight-innerHeight),behavior:'instant'}),p);await page.waitForFunction(p=>Math.abs(hybrid.progress-p)<.004,p,{timeout:90000});};
              const id=await page.evaluate(()=>hybrid.scene.root.uuid);
              await shot('01-original-hero');
              for(const p of [.08,.12,.19,.255,.32,.385,.415]){
                await scroll(p);
                const state=await page.evaluate(()=>({id:hybrid.scene.root.uuid,alpha:hybrid.liveOpacity,front:hybrid.frontOpacity,curtain:getComputedStyle(document.querySelector('#curtain')).display,active:hybrid.liveActive}));
                if(state.id!==id||state.alpha<.99||state.front>.01||state.curtain!=='none'||!state.active)throw Error('Interrupted live model at '+p+': '+JSON.stringify(state));
                if([.08,.19,.32,.415].includes(p))await shot('live-'+p);
              }
              await scroll(.32);
              const before=await page.evaluate(()=>hybrid.scene.root.rotation.y);
              const box=await page.locator('#live').boundingBox();
              await page.mouse.move(box.x+box.width*.60,box.y+box.height*.48);await page.mouse.down();await page.mouse.move(box.x+box.width*.60+65,box.y+box.height*.48+18,{steps:5});await page.mouse.up();
              await page.waitForFunction(v=>Math.abs(hybrid.scene.root.rotation.y-v)>.1,before,{timeout:60000});await shot('02-drag');
              await page.locator('#mode').click();await page.waitForFunction(()=>hybrid.photoOnly&&hybrid.liveOpacity===0&&!hybrid.liveActive,{},{timeout:60000});await shot('02-original-photo');await page.locator('#mode').click();
              await scroll(.48);await page.waitForFunction(()=>hybrid.frontOpacity>.15&&hybrid.frontOpacity<.85,{},{timeout:60000});await shot('03-transition');
              for(const [i,p] of [[2,.55],[3,.765],[4,.97]]){await scroll(p);await page.waitForFunction(i=>hybrid.chapter===i&&!hybrid.liveActive&&hybrid.frontOpacity===1,i,{timeout:60000});await shot('chapter-'+(i+1));}
              await scroll(.19);await page.waitForFunction(()=>hybrid.liveActive&&hybrid.frontOpacity===0,{},{timeout:60000});
              if(await page.evaluate(()=>hybrid.scene.root.uuid)!==id)throw Error('Live product recreated on reverse scroll');
              await scroll(0);await page.waitForFunction(()=>hybrid.liveOpacity===0&&hybrid.frontOpacity===0,{},{timeout:60000});
              await scroll(.695);await page.waitForFunction(()=>hybrid.depthState?.macro>.1&&hybrid.depthState?.macro<.9,{},{timeout:60000});await shot('depth-transition');
              if(errors.length)throw Error(errors.join('\n'));
              console.log(name,'PASS: continuous same-model interval, no blackout, reversible scrolling, all five visuals, drag and photo toggle');
              await page.close();
            }
          }finally{await browser.close()}
          JS
          node smoke-cinema.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cinema-browser-checkpoints
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

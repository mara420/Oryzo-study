name: V1.4 immersive photo layers and browser validation
on:
  workflow_dispatch:
  push:
    paths:
      - 'immersive/**'
      - 'tools/prepare_immersive_v14.py'
      - '.github/workflows/build-immersive.yml'
permissions:
  contents: write
concurrency:
  group: immersive-v14
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet pillow==11.3.0 numpy==2.2.6 opencv-python-headless==4.12.0.88
      - name: Generate eight photographic foreground layers
        run: python tools/prepare_immersive_v14.py
      - name: Validate all eleven images and layer transparency
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import json
          root=Path("assets/immersive-v14")
          m=json.loads((root/"manifest.json").read_text())
          assert sum(len(s["layers"]) for s in m.values())==8
          for s in m.values():
              for name in [s["base"]]+[l["file"] for l in s["layers"]]:
                  with Image.open(root/name) as im:
                      im.load()
                      assert im.size==(1280,720)
                      if name!=s["base"]:
                          assert im.mode=="RGBA" and im.getchannel("A").getextrema()==(0,255)
                      print(name,(root/name).stat().st_size)
          PY
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: |
          python - <<'PY'
          import re,pathlib
          s=pathlib.Path("immersive/index.html").read_text()
          scripts=re.findall(r'<script(?: type="module")?>(.*?)</script>',s,re.S)
          assert len(scripts)==2
          for i,script in enumerate(scripts): pathlib.Path('/tmp/immersive-'+str(i)+'.mjs').write_text(script)
          PY
          node --check /tmp/immersive-0.mjs
          node --check /tmp/immersive-1.mjs
      - run: npm install --no-save --no-package-lock playwright@1.51.1 three@0.178.0
      - run: npx playwright install --with-deps chromium
      - name: Verify layered motion and single WebGL context
        run: |
          python -m http.server 8765 >/tmp/oryzo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          mkdir -p test-output
          cat > smoke-immersive.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          async function setup(page){
            const prefix='https://cdn.jsdelivr.net/npm/three@0.178.0/',root=path.resolve('node_modules/three');
            await page.route(prefix+'**',async r=>{const f=path.resolve(root,new URL(r.request().url()).pathname.split('/three@0.178.0/')[1]);if(!f.startsWith(root+path.sep))return r.abort();await r.fulfill({body:await fs.readFile(f),contentType:'application/javascript'});});
          }
          try{
            for(const [name,viewport,motion] of [['desktop',{width:1100,height:619},'no-preference'],['mobile',{width:390,height:844},'reduce']]){
              const page=await browser.newPage({viewport,deviceScaleFactor:1,reducedMotion:motion}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));await setup(page);
              await page.goto('http://127.0.0.1:8765/immersive/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.hybrid?.version==='1.4'&&hybrid.scene&&hybrid.layerReady&&hybrid.layerCount===8&&hybrid.heroReady&&hybrid.plateReady,{},{timeout:120000});
              const shot=async s=>page.screenshot({path:'test-output/'+name+'-'+s+'.png',timeout:90000});
              const scroll=async p=>{await page.evaluate(p=>scrollTo({top:p*(document.documentElement.scrollHeight-innerHeight),behavior:'instant'}),p);await page.waitForFunction(p=>Math.abs(hybrid.progress-p)<.004,p,{timeout:90000});};
              await shot('01-original');
              await scroll(.16);await page.waitForFunction(()=>hybrid.liveActive&&hybrid.layerState.hero>.4,{},{timeout:60000});await shot('02-layered-workshop');
              const id=await page.evaluate(()=>hybrid.scene.root.uuid);
              await scroll(.32);await page.waitForFunction(()=>hybrid.liveActive&&hybrid.chapter===1,{},{timeout:60000});await shot('03-product');
              await scroll(.56);await page.waitForFunction(()=>hybrid.chapter===2&&hybrid.frontOpacity===1,{},{timeout:60000});
              const layer=page.locator('#front .photoGroup.ready .layer').first();
              if(name==='desktop'){
                await page.mouse.move(260,180);await page.waitForTimeout(160);
                const before=await layer.evaluate(e=>e.style.transform);
                await page.mouse.move(850,410);
                await page.waitForFunction(v=>document.querySelector('#front .photoGroup.ready .layer').style.transform!==v,before,{timeout:60000});
              }
              await shot('04-touch');
              await scroll(.71);await shot('05-macro-transition');
              await scroll(.97);await page.waitForFunction(()=>hybrid.chapter===4&&hybrid.frontOpacity===1,{},{timeout:60000});await shot('06-ritual');
              if(await page.locator('canvas').count()!==3)throw Error('Unexpected second WebGL renderer');
              await scroll(.19);await page.waitForFunction(()=>hybrid.liveActive&&hybrid.frontOpacity===0,{},{timeout:60000});
              if(await page.evaluate(()=>hybrid.scene.root.uuid)!==id)throw Error('Live model recreated');
              if(errors.length)throw Error(errors.join('\n'));
              console.log(name,'PASS: 8 layers, independent pointer movement (desktop), single GL context and reversible timeline');
              await page.close();
            }
            const fallback=await browser.newPage({viewport:{width:800,height:450},reducedMotion:'reduce'});await setup(fallback);
            await fallback.route('**/assets/immersive-v14/manifest.json',r=>r.abort());
            await fallback.goto('http://127.0.0.1:8765/immersive/');
            await fallback.waitForFunction(()=>hybrid.scene&&hybrid.heroReady&&hybrid.plateReady&&!hybrid.layerReady,{},{timeout:120000});
            await fallback.evaluate(()=>scrollTo(0,.32*(document.documentElement.scrollHeight-innerHeight)));
            await fallback.waitForFunction(()=>hybrid.liveActive,{},{timeout:60000});
            await fallback.screenshot({path:'test-output/fallback-original-photos.png',timeout:90000});
            await fallback.close();
          }finally{await browser.close()}
          JS
          node smoke-immersive.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: immersive-v14-review
          path: |
            test-output/
            assets/immersive-v14/
          if-no-files-found: warn
          retention-days: 14
      - name: Publish generated photo layers after browser checks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/immersive-v14/
          git diff --cached --quiet && exit 0
          git commit -m 'Publish validated V1.4 photographic layers'
          git pull --rebase origin main
          git push origin HEAD:main

name: Test V0.5 live WebGL
on:
  workflow_dispatch:
  push:
    paths:
      - 'v05/**'
      - 'tools/smoke_v05.mjs'
      - '.github/workflows/test-v05.yml'
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1 three@0.178.0
      - run: npx playwright install --with-deps chromium
      - name: Render and inspect interactive checkpoints
        run: |
          python3 -m http.server 8765 > /tmp/oryzo-http.log 2>&1 &
          server=$!
          trap 'kill "$server" || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/v05/ > /dev/null && break; sleep 1; done
          node tools/smoke_v05.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: v05-browser-checkpoints
          path: test-output/
          if-no-files-found: warn
          retention-days: 14

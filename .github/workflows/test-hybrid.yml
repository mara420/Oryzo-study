name: Test hybrid photographic and live 3D experience
on:
  workflow_dispatch:
  push:
    paths:
      - 'hybrid/**'
      - 'photo/assets/**'
      - '.github/workflows/test-hybrid.yml'
permissions:
  contents: read
concurrency:
  group: hybrid-browser-test
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --no-package-lock playwright@1.51.1 three@0.178.0
      - run: npx playwright install --with-deps chromium
      - name: Verify five images and genuine WebGL interaction
        run: |
          python3 -m http.server 8765 >/tmp/oryzo-http.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:8765/hybrid/ >/dev/null && break; sleep 1; done
          mkdir -p test-output
          cat > smoke-hybrid.mjs <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs/promises';
          import path from 'node:path';
          const browser=await chromium.launch({headless:true,args:['--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader','--disable-dev-shm-usage']});
          try{
            for(const [name,viewport] of [['desktop',{width:1280,height:720}],['mobile',{width:390,height:844}]]){
              const page=await browser.newPage({viewport,deviceScaleFactor:1,reducedMotion:'reduce'}),errors=[];
              page.on('pageerror',e=>errors.push(e.message));
              const prefix='https://cdn.jsdelivr.net/npm/three@0.178.0/',root=path.resolve('node_modules/three');
              await page.route(prefix+'**',async r=>{const f=path.resolve(root,new URL(r.request().url()).pathname.split('/three@0.178.0/')[1]);if(!f.startsWith(root+path.sep))return r.abort();await r.fulfill({body:await fs.readFile(f),contentType:'application/javascript'});});
              await page.goto('http://127.0.0.1:8765/hybrid/',{waitUntil:'domcontentloaded'});
              await page.waitForFunction(()=>window.hybrid?.scene&&hybrid.heroReady&&hybrid.plateReady&&[...document.querySelectorAll('#plates img')].every(i=>i.complete&&i.naturalWidth>0),{},{timeout:120000});
              const shot=async s=>page.screenshot({path:'test-output/'+name+'-'+s+'.png',timeout:60000});
              const scroll=async p=>{await page.evaluate(p=>scrollTo(0,p*(document.documentElement.scrollHeight-innerHeight)),p);await page.waitForFunction(p=>Math.abs(hybrid.progress-p)<.004,p,{timeout:60000});};
              await shot('01-photo-hero');
              await scroll(.072);await page.waitForFunction(()=>hybrid.liveActive,{},{timeout:60000});await shot('02-live-hero');
              await scroll(.27);await page.waitForFunction(()=>hybrid.liveActive&&hybrid.chapter===1,{},{timeout:60000});
              const before=await page.evaluate(()=>hybrid.scene.root.rotation.y);
              const box=await page.locator('#live').boundingBox();
              await page.mouse.move(box.x+box.width*.60,box.y+box.height*.48);await page.mouse.down();await page.mouse.move(box.x+box.width*.60+65,box.y+box.height*.48+18,{steps:5});await page.mouse.up();
              await page.waitForFunction(v=>Math.abs(hybrid.scene.root.rotation.y-v)>.1,before,{timeout:60000});
              await shot('03-live-drag');
              await page.locator('#mode').click();await page.waitForFunction(()=>hybrid.photoOnly&&!hybrid.liveActive,{},{timeout:60000});await shot('04-photo-mode');await page.locator('#mode').click();
              for(const [i,p] of [[2,.48],[3,.685],[4,.91]]){await scroll(p);await page.waitForFunction(i=>hybrid.chapter===i&&!hybrid.liveActive,i,{timeout:60000});await shot('0'+(i+3)+'-chapter');}
              if(errors.length)throw Error(errors.join('\n'));
              console.log(name,'PASS: all five original images, WebGL, live hero, product drag, photo toggle and chapter navigation');
              await page.close();
            }
          } finally{await browser.close()}
          JS
          node smoke-hybrid.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hybrid-browser-checkpoints
          path: test-output/
          if-no-files-found: warn
          retention-days: 14
